    <script>
// Mobile redirect – works on every iPhone, even when it lies about screen.width
if (sessionStorage.getItem('mobileDone')) {
    // already redirected this session → do nothing
} else if (/iPhone|iPad|iPod|Android|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
           /iPhone|iPad|iPod|Android/i.test(navigator.platform) ||
           (screen.width <= 812 && screen.height <= 896)) {

    sessionStorage.setItem('mobileDone', '1');

    var newPage = location.pathname.toLowerCase().includes('studio')

    <style>
        /* Home-specific styles */
        .hero {
            position: relative;
            width: 100%;
            height: 80vh; /* 80% of viewport height */
            margin-top: -80px;  /* Pull up to cover space left by header padding */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures image covers the area without distorting */
            filter: grayscale(100%); /* Force B&W for consistency */
        }
        .hero-text {
            position: absolute;
            text-align: center;
            top: 50%;
            left: 50%;
            /* Shift down by 30% of its own height to move it visually away from the header */
            transform: translate(-50%, -30%);
            color: var(--color-white);
            background-color: rgba(17, 17, 17, 0.5); /* Subtle dark overlay for readability */
            padding: 20px 40px;
        }
        .hero h1 {
            font-size: 3rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .hero p {
            font-size: 1.2rem;
            font-family: var(--font-serif);
            margin-top: 10px;
        }
        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .hero p { font-size: 1rem; }
            .hero { height: 70vh; }
        }
    </style>
