    <style>
        body{margin:0;background:#fff;color:#111;font-family:'Poppins',sans-serif;font-size:18px;line-height:1.65;}
        a{color:#000;text-decoration:none;}
        .header{
    padding:1rem 1.2rem 0.6rem;   /* reduced bottom padding = tiny gap */
    border-bottom:1px solid #eee;
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:flex-start;
}
.logo-link{
    display:flex;
    align-items:center;
    font-weight:600;
    font-size:1.1em;
    white-space:nowrap;
    letter-spacing:-0.45px;
    text-decoration:none;
}
.logo-img{
    height:36px;
    width:auto;
    margin-right:9px;
    border:none !important;
    object-fit:contain;
}
.nav{
    display:flex;
    flex-direction:column;     /* stacks them vertically */
    text-align:right;
    gap:0.35rem;               /* tiny, elegant spacing between links */
    margin-top:0;         /* tiny gap from the logo line */
}
.nav a{
    font-weight:500;
    font-size:0.98em;
    padding:0.2rem 0;
}
        .container{padding:2rem 1.2rem 4rem;text-align:center;}
        h2{font-size:2.2em;font-weight:600;margin:0 0 2.5rem;letter-spacing:-0.5px;}
        .gallery-grid{display:grid;grid-template-columns:1fr;gap:2.8rem;max-width:800px;margin:0 auto;}
        .gallery-item img{width:100%;height:auto;display:block;object-fit:cover;border:1px solid #ddd;
                         box-shadow:0 6px 16px rgba(0,0,0,0.09);transition:transform .4s ease;}
        .gallery-item img:active{transform:scale(0.98);}
        .footer{text-align:center;padding:2rem 1rem;border-top:1px solid #eee;font-size:0.9em;color:#888;}
        .footer img{height:25px;margin-right:8px;vertical-align:middle;}
                .footer a {
    color: #888; /* Set links to the same light gray */
    text-decoration: none;
    transition: color 0.2s ease;
}

.footer-email {
    color: #888;
}
        .desktop{text-align:center;margin:5rem 0 2rem;color:#666;font-size:0.9em;}
    </style>
